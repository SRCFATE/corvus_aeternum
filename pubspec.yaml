name: corvus_aeternum
description: "Corvus Aeternum — Plataforma cultural digital para artistas, coleccionistas y críticos."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # URLs limpias en web (no-op en el resto de plataformas)
  flutter_web_plugins:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.12.0

  # Navigation
  go_router: ^14.6.3

  # Editor WYSIWYG del Atelier: formato combinable y atributos por párrafo.
  flutter_quill: ^11.5.1
  markdown_quill: ^4.3.0
  markdown: ^7.3.1
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Images
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1

  # Utilities
  path: ^1.9.1
  shared_preferences: ^2.5.4
  intl: ^0.20.2

  # El cobro ocurre en el proveedor de pagos, nunca dentro de Corvus: hace
  # falta poder abrir su checkout y su portal de cliente.
  url_launcher: ^6.3.1

  # Descarga de exportaciones en web, la plataforma principal de Corvus. En el
  # resto no se usa: allí la entrega cae en copiar al portapapeles.
  web: ^1.1.0

  # Exportación profesional. DOCX, EPUB y el paquete del proyecto son ZIP con
  # XML dentro, así que basta un empaquetador; el PDF sí necesita un motor de
  # maquetación propio.
  archive: ^4.0.0
  pdf: ^3.11.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
