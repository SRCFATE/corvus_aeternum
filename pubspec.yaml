name: corvus_aeternum
description: "Corvus Aeternum — Plataforma cultural digital para artistas, coleccionistas y críticos."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # URLs limpias en web (no-op en el resto de plataformas)
  flutter_web_plugins:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.12.0

  # Navigation
  go_router: ^14.6.3

  # State management
  provider: ^6.1.2

  # Images
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1

  # Utilities
  path: ^1.9.1
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
