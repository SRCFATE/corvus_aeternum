# Corvus se compila en CI y se publica por Direct Upload. El entorno de build
# de Cloudflare Pages no trae Flutter, así que instalarlo allí en cada
# despliegue dependería de scripts propios; aquí la fuente vive en el
# repositorio y CI genera el artefacto de forma reproducible.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Un push nuevo sobre la misma referencia cancela la ejecución anterior: no
# tiene sentido desplegar un commit que ya quedó atrás.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regresion-visual:
    name: Regresión visual (Windows)
    # La referencia con Lora se generó en Windows. El rasterizado tipográfico
    # no es idéntico entre Windows y Linux, incluso con el mismo Flutter.
    runs-on: windows-2022
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7.0.1

      - name: Instalar Flutter 3.44.0
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Resolver dependencias
        run: flutter pub get

      - name: Comparar referencias visuales
        run: flutter test --no-pub --tags golden

      - name: Conservar diferencias visuales
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: diferencias-visuales-windows
          path: test/failures/**
          if-no-files-found: ignore
          retention-days: 7

  verificar-y-desplegar:
    name: Verificar y desplegar
    # La comparación exacta de píxeles sigue siendo una barrera de despliegue.
    needs: regresion-visual
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7.0.1

      # Versión fija, no `stable` a secas: es exactamente la que produjo estos
      # tests y este build. Con el canal suelto, un cambio de Flutter podría
      # romper un despliegue sin que el código hubiera cambiado.
      - name: Instalar Flutter 3.44.0
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Resolver dependencias
        run: flutter pub get

      - name: Analizar
        run: flutter analyze

      - name: Pruebas
        # Las comprobaciones de estructura/contraste también corren en Linux;
        # únicamente la comparación de píxeles vive en el trabajo de Windows.
        run: flutter test --exclude-tags golden

      # `--no-web-resources-cdn` empaqueta CanvasKit en el propio sitio en vez
      # de descargarlo de gstatic.com en cada arranque. Dos motivos: la
      # politica de seguridad de `web/_headers` solo permite scripts del propio
      # origen, y la conexion a Supabase ya esta abierta cuando arranca la
      # aplicacion, mientras que gstatic exigiria un DNS y un TLS mas antes de
      # pintar el primer fotograma.
      - name: Compilar web
        run: flutter build web --release --no-web-resources-cdn

      # La barrera de calidad: si algo de lo anterior falla, producción no se
      # toca. Y una pull request llega hasta aquí sin desplegar nada.
      - name: Desplegar a Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          npx --yes wrangler@4.128.0 pages deploy build/web
          --project-name corvus-aeternum
          --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
